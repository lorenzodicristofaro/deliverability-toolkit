[project]
name = "deliverability-toolkit"
version = "0.1.0"
description = "Self-hosted email deliverability toolkit"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff 0.17.3 formats Markdown code blocks (verified 2026-11-04: with --isolated,
# `ruff format --check --diff ARCHITECTURE.md` reports it would be reformatted).
# extend-exclude applies to both lint and format; force-exclude keeps it effective for
# files passed explicitly (e.g. by pre-commit). Docs: https://docs.astral.sh/ruff/settings/
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests need Docker + network: excluded by default, run with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs Docker and network (tests/integration); run with -m integration",
]
