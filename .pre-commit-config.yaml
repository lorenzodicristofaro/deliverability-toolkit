repos:
  # rev verified 2026-11-04 via git ls-remote (latest tag); hook ids from the repo's .pre-commit-hooks.yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # rev verified 2026-11-04 via git ls-remote (latest tag). The hook has language: golang,
  # so pre-commit needs network access on first run (it provisions Go itself).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
