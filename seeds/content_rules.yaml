# Content rules seed (M5-12). Synced into global `content_rules` rows at app start (seed_sync).
# Keep it SMALL. A rule is `verified` only when a primary source, read on `verified_on`, states
# the practice it flags; such a rule cites that page in `sources`. Everything else is an
# `unverified` heuristic and ships `enabled: false` until the maintainer confirms it. On an
# unverified rule `verified_on` is the day its basis was last reviewed, not a confirmation.
# Never add vendor/ISP "spam word" lists or attribute a rule to a mailbox provider without its
# official page.
# Display text comes from i18n keys CONTENT_RULE.<key>.title / CONTENT_RULE.<key>.advice (en, it).
# `flags` are names: ignorecase, multiline, dotall, verbose, ascii (regex rules only). Regex
# patterns must pass app.core.safe_regex.compile_checked. A key removed from this file disables
# the global row (never deletes it); rows an instance admin modified (locally_modified) are left
# alone.
rules:
  # Google "Email sender guidelines", section "Message formatting requirements and guidelines":
  # "don't send messages with subject lines starting with Re: or Fwd: unless the messages are
  # actual replies or forwards".
  # Verified but disabled: the source covers subject lines only and exempts real replies. A rule
  # has no target field and no view of In-Reply-To/References, so as a plain pattern it would also
  # flag real replies and bodies that start with "Re:". Enable it once the engine can scope it.
  - key: subject_fake_reply_forward_prefix
    kind: regex
    pattern: '\A\s*(?:re|fwd)\s*:'
    flags: [ignorecase]
    weight: 20
    category: deceptive_subject
    severity: medium
    language: null
    enabled: false
    status: verified
    verified_on: 2026-11-08
    sources:
      - https://support.google.com/a/answer/81126

  # Generic heuristic, no primary source: runs of three or more ! or ?.
  - key: shouting_punctuation
    kind: regex
    pattern: '[!?]{3,}'
    flags: []
    weight: 5
    category: formatting
    severity: low
    language: null
    enabled: false
    status: unverified
    verified_on: 2026-11-08
    sources: []

  # Generic heuristic, no primary source: four or more consecutive all-caps words (ASCII letters
  # only, so words with accented capitals do not count).
  - key: all_caps_run
    kind: regex
    pattern: '\b[A-Z]{2,}(?:\s+[A-Z]{2,}){3,}\b'
    flags: []
    weight: 5
    category: formatting
    severity: low
    language: null
    enabled: false
    status: unverified
    verified_on: 2026-11-08
    sources: []
