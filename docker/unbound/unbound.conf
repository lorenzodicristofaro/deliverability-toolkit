# Recursive, validating resolver for the toolkit. Loaded as
# /etc/unbound/unbound.conf.d/toolkit.conf next to Debian's root-auto-trust-anchor-file.conf
# (auto-trust-anchor-file: /var/lib/unbound/root.key). Every option below is justified in
# docs/UNBOUND.md ("Config audit"); anything not listed there is left at its default.
# Manual: https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
# The address/subnet below MUST match the "dns" network in compose.yaml.
server:
    # Container already runs as user unbound: no privilege drop (avoids an initgroups warning)
    # and no pidfile (default /run/unbound.pid is not writable on the read-only rootfs).
    username: ""
    pidfile: ""
    # Log to stderr (docker logs) instead of syslog.
    use-syslog: no

    # Unprivileged port, internal network only (never published).
    port: 5353
    interface: 172.28.53.2
    interface: 127.0.0.1

    # Only the loopback (healthcheck) and the internal subnet; everything else is refused
    # (the default for unmatched sources).
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow

    qname-minimisation: yes
