# Minimal recursive, validating resolver for the toolkit. UNVERIFIED against the chosen
# image: confirm option names and the config mount path with the image README and the
# Unbound documentation (unbound.docs.nlnetlabs.nl) before relying on it.
server:
    # Listen on all container interfaces; reachable only on the compose network
    # (no ports are published).
    interface: 0.0.0.0
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Privacy / hardening basics.
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Small cache, enough for deliverability checks.
    msg-cache-size: 16m
    rrset-cache-size: 32m
