# Recursive, validating resolver for the toolkit. Loaded as
# /etc/unbound/unbound.conf.d/toolkit.conf next to Debian's root-auto-trust-anchor-file.conf
# (which sets auto-trust-anchor-file: /var/lib/unbound/root.key). Option semantics:
# unbound.conf(5), https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
# The addresses/subnet below MUST match the "dns" network in compose.yaml.
server:
    # Already non-root (USER unbound in the Dockerfile): no privilege drop, no pidfile.
    username: ""
    pidfile: ""
    chroot: ""
    directory: "/etc/unbound"
    use-syslog: no
    logfile: ""

    # Listen only on the internal compose network address (and loopback for the healthcheck).
    interface: 172.28.53.2
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only the internal subnet may query; everything else is refused.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.53.0/24 allow

    # Full recursion from the root: no forward-zone anywhere. Root hints from dns-root-data.
    root-hints: "/usr/share/dns/root.hints"

    # DNSSEC validation: trust anchor comes from Debian's snippet (see above).
    harden-dnssec-stripped: yes
    harden-glue: yes
    qname-minimisation: yes

    hide-identity: yes
    hide-version: yes

    msg-cache-size: 16m
    rrset-cache-size: 32m

remote-control:
    # Unix socket only, used by the container healthcheck.
    control-enable: yes
    control-interface: /run/unbound/control.sock
