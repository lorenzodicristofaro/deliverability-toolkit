# Default `docker compose up` starts only the app (SQLite, zero config).
#   docker compose --profile postgres up   adds PostgreSQL
#   docker compose --profile unbound up    adds a local validating resolver
# Secrets come from the environment or a gitignored .env (see .env.example).
# Nothing here is required for the default run: all interpolations have empty defaults,
# so a missing .env or unset variables never break the app-only start.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      SECRET_KEY: ${SECRET_KEY:-}          # not consumed until M1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}  # not consumed until M1
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:17  # tag from Docker Hub "postgres" page (17 listed as supported)
    environment:
      # Required by the image. Deliberately `:-` and not `:?`: the Compose docs do not say
      # whether `:?` is evaluated for services in inactive profiles (UNVERIFIED), and it
      # could break the default `docker compose up`. With an empty value the postgres
      # image itself refuses to start, which is the loud failure we want.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-deliverability}
      POSTGRES_DB: ${POSTGRES_DB:-deliverability}
    volumes:
      # 17 and earlier mount at /var/lib/postgresql/data (Docker Hub page). 18+ differs.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  unbound:
    profiles: ["unbound"]
    # UNVERIFIED: NLnet Labs publishes no official image that we could confirm. This is a
    # community multi-arch image (Docker Hub klutchell/unbound); tag not verified, so it
    # must be pinned and reviewed by the maintainer before release.
    image: klutchell/unbound:latest
    volumes:
      # UNVERIFIED path: the image README mentions /etc/unbound/custom.conf.d.
      - ./docker/unbound:/etc/unbound/custom.conf.d:ro
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
