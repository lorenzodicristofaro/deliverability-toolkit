name: Secret scan

# Separate from ci.yml because that workflow is skipped on docs-only changes, and docs can contain
# secrets too. Same triggers as ci.yml, with no path filter: never add one here.
on:
  pull_request:
  push:
    branches: [dev, qa, main]

# Read-only token, nothing is pushed anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      # Same scanner and version as the pre-commit hook (.pre-commit-config.yaml, rev v8.30.1).
      # The official gitleaks-action needs a GITLEAKS_LICENSE secret for organization repos, so
      # the pinned release binary is used instead. sha256 from the release's checksums file.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan full history, not only the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      # The pre-commit hook only scans staged changes, so CI scans the git history instead.
      - run: ./gitleaks git --redact --verbose .
