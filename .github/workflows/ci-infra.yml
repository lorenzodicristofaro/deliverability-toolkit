name: CI infra

# Docker-related CI jobs, moved out of ci.yml to save billed Actions minutes (M6-00). On `dev`
# pushes and pull requests they run only when a path below changes; on `main` ci.yml calls this
# workflow (workflow_call, no path filter), so `main` runs every job. `qa` does not run CI.
# A skipped workflow reports nothing, neither success nor failure.
#
# Paths and why (one list for all three jobs):
#   Dockerfile                         docker-build builds it and the compose smoke runs it
#   .dockerignore                      changes the docker build context
#   compose.yaml                       docker-build smoke and integration-unbound run it
#   docker/**                          Unbound image: Dockerfile and unbound.conf built by all three jobs
#   scripts/unbound-arm64-smoke.sh     run by unbound-arm64-smoke
#   pyproject.toml                     dependencies and pytest markers used by the image and integration-unbound
#   uv.lock                            pinned dependencies installed by the image and integration-unbound
#   alembic.ini                        COPYed into the image, the container runs alembic on start
#   tests/integration/**               the integration-unbound test suite and its Docker helpers
#   tests/conftest.py                  loaded by pytest for the integration tests
#   tests/support/**                   imported by tests/conftest.py (tests.support.dns_zones)
#   tests/__init__.py                  makes `tests` a package for those imports
#   tests/dnssec_tag.py                imported by tests/integration/test_unbound.py
#   migrations/**                      compose smoke runs `alembic upgrade head` at container start
#   seeds/**                           compose smoke runs the startup seed sync
#   profiles/**                        COPYed into the image (ESP profiles, loaded at runtime from M6)
#   .github/workflows/ci-infra.yml     this workflow itself
# Deliberately NOT listed: app/, locales/ (the image COPYs them, but the test jobs cover their
# behaviour and listing them would run these jobs on nearly every code push).
# tests/conftest.py is listed because the integration tests load it.
# A new file the Docker jobs depend on must be added here.
on:
  workflow_call:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "scripts/unbound-arm64-smoke.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "migrations/**"
      - "seeds/**"
      - "profiles/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "tests/support/**"
      - "tests/__init__.py"
      - "tests/dnssec_tag.py"
      - ".github/workflows/ci-infra.yml"
  push:
    branches: [dev]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "scripts/unbound-arm64-smoke.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "migrations/**"
      - "seeds/**"
      - "profiles/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "tests/support/**"
      - "tests/__init__.py"
      - "tests/dnssec_tag.py"
      - ".github/workflows/ci-infra.yml"

# Read-only token, no secrets, nothing is pushed anywhere.
permissions:
  contents: read

# Own group name: github.workflow is the caller's name under workflow_call and would collide with ci.yml.
concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA; the tag in the comment is the release
# the SHA belongs to (tags and SHAs checked with `git ls-remote` against each official repo).

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build check only: no registry login, no push, no load (multi-platform results stay in cache).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      # Unbound image (docker/unbound): multi-arch build check, no push. Maintenance: docs/UNBOUND.md.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/unbound
          platforms: linux/amd64,linux/arm64
          push: false
      # Smoke test on the native platform. Default profiles only (app + SQLite, no postgres/unbound).
      # `--wait` blocks until the compose healthcheck of the app reports healthy.
      # Throwaway per-run secrets (required since M1); masked in logs, never stored.
      - name: Generate throwaway app secrets
        run: |
          for name in SECRET_KEY ENCRYPTION_KEY; do
            value=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Compose up and wait for healthy
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check /healthz
        run: curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/healthz
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  # Unbound profile against the real image: DNSSEC (AD, SERVFAIL on bad signature), NXDOMAIN,
  # REFUSED from outside the subnet, DNSBL test entry, KSK-2024 anchor, root.key persistence,
  # hardening. Run locally: `uv run pytest -m integration`. Excluded from the test jobs by marker.
  # The DNSBL test skips (not fails) on a provider-side block. See docs/UNBOUND.md.
  integration-unbound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -m integration -q --tb=short -rs

  # arm64 smoke test under QEMU (build, start, resolve a signed name, require AD). QEMU is slow:
  # the script retries (12 x 10 s); a name that never validates fails the job.
  unbound-arm64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: scripts/unbound-arm64-smoke.sh
