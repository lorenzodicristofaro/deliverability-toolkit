name: CI

# `qa` is not a trigger: it only receives `dev` commits whose CI is already green (docs/WORKFLOW.md).
# The three Docker jobs (docker-build, integration-unbound, unbound-arm64-smoke) live in
# ci-infra.yml: there they run on `dev` pushes and pull requests only when a file they depend on
# changes. Here the `infra` job calls that workflow on `main` pushes only, so `main` always runs
# every job (a skipped job costs no minutes). Called jobs are reported as "infra / <job>".
#
# Pushes and pull requests that change only these paths skip this whole workflow; a skipped
# workflow reports nothing, neither success nor failure. Secret scanning is in secret-scan.yml,
# which has no path filter. docs/TESTING.md is deliberately not listed, nor `docs/**`:
# tests/tenancy/test_matrix.py reads it. A new file under docs/ runs CI until it is listed.
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/tickets/**"
      - "docs/reports/**"
      - "docs/CHECKS.md"
      - "docs/DNS.md"
      - "docs/DNS_FIXTURES.md"
      - "docs/HANDOFF.md"
      - "docs/HEADERS.md"
      - "docs/RELEASE.md"
      - "docs/SETUP.md"
      - "docs/UNBOUND.md"
      - "docs/WORKFLOW.md"
  push:
    branches: [dev, main]
    paths-ignore:
      - "*.md"
      - "docs/tickets/**"
      - "docs/reports/**"
      - "docs/CHECKS.md"
      - "docs/DNS.md"
      - "docs/DNS_FIXTURES.md"
      - "docs/HANDOFF.md"
      - "docs/HEADERS.md"
      - "docs/RELEASE.md"
      - "docs/SETUP.md"
      - "docs/UNBOUND.md"
      - "docs/WORKFLOW.md"
  # Weekly full run on the default branch, `slow` tests included (M7-00b, docs/TESTING.md).
  schedule:
    - cron: "41 3 * * 2"

# Read-only token, no secrets, nothing is pushed anywhere.
permissions:
  contents: read

# The event name keeps the weekly scheduled run and `main` pushes from cancelling each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Tests marked `slow` (redundant regex timing rows, M7-00b) run only on `main` pushes and in the
# weekly scheduled run; `dev` pushes and pull requests deselect them.
env:
  PYTEST_MARKERS: >-
    ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    && 'not integration' || 'not integration and not slow' }}

# Third-party actions are pinned to a full commit SHA; the tag in the comment is the release
# the SHA belongs to (tags and SHAs checked with `git ls-remote` against each official repo).

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Same commands as CLAUDE.md "Commands". `--frozen` makes CI fail if uv.lock is stale.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  # The two test checks partition the suite with --db-backend (tests/conftest.py, docs/TESTING.md).
  # They run as shards (`--shard=K/N`: SQLite 4, PostgreSQL 6; whole test files, split by measured
  # cost in tests/support/shard_weights.json); the shards are disjoint and together are the side.
  # `test-sqlite` and `test-postgres` keep the required check names: they only gather the shard
  # results and fail unless every shard succeeded (a failed, cancelled or skipped shard fails).
  # This side runs every test except the PostgreSQL params, with no database service.
  test-sqlite-shard:
    name: test-sqlite shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: nproc  # runner CPU count; `-n auto` starts one pytest-xdist worker per CPU
      - run: >-
          uv run pytest -q --tb=short --durations=25 -n auto --db-backend=sqlite
          --shard=${{ matrix.shard }}/4 -m "$PYTEST_MARKERS"

  test-sqlite:
    if: always()
    needs: test-sqlite-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "shard results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  # Only the PostgreSQL params. --db-backend=postgresql refuses to run without TEST_DATABASE_URL,
  # so a shard cannot skip everything and pass.
  test-postgres-shard:
    name: test-postgres shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Ephemeral PostgreSQL for the DB tests (same tag as compose.yaml). The credentials are
    # throwaway literals valid only for this job's service container: not secrets, not reused.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # With this set, the db_url and migrated_db_url fixtures can use PostgreSQL (tests/conftest.py).
      TEST_DATABASE_URL: postgresql://ci:ci-throwaway-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: nproc  # runner CPU count; `-n auto` starts one pytest-xdist worker per CPU
      # Each worker creates and uses its own database ci_test_gwN on this shard's service.
      - run: >-
          uv run pytest -q --tb=short --durations=25 -n auto --db-backend=postgresql
          --shard=${{ matrix.shard }}/6 -m "$PYTEST_MARKERS"

  test-postgres:
    if: always()
    needs: test-postgres-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "shard results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  # Full CI on `main`: the Docker jobs without any path filter (reusable workflow, its `on:` paths
  # do not apply to workflow_call).
  infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-infra.yml

  # Dependency audit (M6-24), defined in pip-audit.yml, which also runs weekly on its own. Behind
  # the same docs-only skip as the test jobs (maintainer decision 2026-11-12): the weekly run
  # covers new advisories on quiet weeks.
  pip-audit:
    # Not on the weekly schedule of this workflow: pip-audit.yml has its own weekly run.
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/pip-audit.yml
