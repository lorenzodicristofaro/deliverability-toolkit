name: CI

# `qa` is not a trigger: it only receives `dev` commits whose CI is already green (docs/WORKFLOW.md).
# The three Docker jobs (docker-build, integration-unbound, unbound-arm64-smoke) live in
# ci-infra.yml: there they run on `dev` pushes and pull requests only when a file they depend on
# changes. Here the `infra` job calls that workflow on `main` pushes only, so `main` always runs
# every job (a skipped job costs no minutes). Called jobs are reported as "infra / <job>".
#
# Pushes and pull requests that change only these paths skip this whole workflow; a skipped
# workflow reports nothing, neither success nor failure. Secret scanning is in secret-scan.yml,
# which has no path filter. docs/TESTING.md is deliberately not listed, nor `docs/**`:
# tests/tenancy/test_matrix.py reads it. A new file under docs/ runs CI until it is listed.
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/tickets/**"
      - "docs/reports/**"
      - "docs/CHECKS.md"
      - "docs/DNS.md"
      - "docs/DNS_FIXTURES.md"
      - "docs/HANDOFF.md"
      - "docs/HEADERS.md"
      - "docs/RELEASE.md"
      - "docs/SETUP.md"
      - "docs/UNBOUND.md"
      - "docs/WORKFLOW.md"
  push:
    branches: [dev, main]
    paths-ignore:
      - "*.md"
      - "docs/tickets/**"
      - "docs/reports/**"
      - "docs/CHECKS.md"
      - "docs/DNS.md"
      - "docs/DNS_FIXTURES.md"
      - "docs/HANDOFF.md"
      - "docs/HEADERS.md"
      - "docs/RELEASE.md"
      - "docs/SETUP.md"
      - "docs/UNBOUND.md"
      - "docs/WORKFLOW.md"

# Read-only token, no secrets, nothing is pushed anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA; the tag in the comment is the release
# the SHA belongs to (tags and SHAs checked with `git ls-remote` against each official repo).

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Same commands as CLAUDE.md "Commands". `--frozen` makes CI fail if uv.lock is stale.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  # The two test jobs partition the suite with --db-backend (tests/conftest.py, docs/TESTING.md):
  # this one runs every test except the PostgreSQL params, with no database service.
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: nproc  # runner CPU count; `-n auto` starts one pytest-xdist worker per CPU
      # pytest-xdist (M7-00, docs/TESTING.md): every worker must collect the same test ids, and
      # test_csrf.py and test_security.py build parameter ids from tokens generated at import
      # (different in every process). They run in the second step, single process; together the
      # two steps run exactly the --db-backend=sqlite selection.
      - run: >-
          uv run pytest -q --tb=short --durations=25 -n auto --db-backend=sqlite
          --ignore=tests/core/test_csrf.py --ignore=tests/core/test_security.py
      - if: success() || failure()  # also report these when the first step failed
        run: >-
          uv run pytest -q --tb=short --db-backend=sqlite
          tests/core/test_csrf.py tests/core/test_security.py

  # Only the PostgreSQL params. --db-backend=postgresql refuses to run without TEST_DATABASE_URL,
  # so this job cannot skip everything and pass.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ephemeral PostgreSQL for the DB tests (same tag as compose.yaml). The credentials are
    # throwaway literals valid only for this job's service container: not secrets, not reused.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # With this set, the db_url and migrated_db_url fixtures can use PostgreSQL (tests/conftest.py).
      TEST_DATABASE_URL: postgresql://ci:ci-throwaway-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: nproc  # runner CPU count; `-n auto` starts one pytest-xdist worker per CPU
      # Each worker creates and uses its own database ci_test_gwN on this service.
      - run: uv run pytest -q --tb=short --durations=25 -n auto --db-backend=postgresql

  # Full CI on `main`: the Docker jobs without any path filter (reusable workflow, its `on:` paths
  # do not apply to workflow_call).
  infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-infra.yml

  # Dependency audit (M6-24), defined in pip-audit.yml, which also runs weekly on its own. Behind
  # the same docs-only skip as the test jobs (maintainer decision 2026-11-12): the weekly run
  # covers new advisories on quiet weeks.
  pip-audit:
    uses: ./.github/workflows/pip-audit.yml
