# Sample message corpus manifest. See README.md. Every .eml in this folder must have one entry.
# status: verified = header shape taken from the cited document; unverified = built only from
# RFC-defined syntax, NOT confirmed against a real message of the labelled provider.
# facts are what M4-14 may assert; they are not parser output.
samples:
  - file: plain-rfc8601-b3.eml
    provider_label: plain-rfc
    status: verified
    sources:
      - https://www.rfc-editor.org/rfc/rfc8601.txt (Appendix B.3)
    verified_on: '2026-11-07'
    notes: "Verbatim RFC 8601 B.3 example, already uses reserved names."
    facts:
      hop_count: 1
      auth_methods: [spf]
      arc_chain: {instances: 0, state: none}
      alignment: {spf: aligned, dkim: not_applicable}
  - file: plain-rfc8601-b4.eml
    provider_label: plain-rfc
    status: verified
    sources:
      - https://www.rfc-editor.org/rfc/rfc8601.txt (Appendix B.4)
    verified_on: '2026-11-07'
    notes: "Verbatim RFC 8601 B.4 example; two Authentication-Results headers, same authserv-id."
    facts:
      hop_count: 1
      auth_methods: [auth, spf, iprev]
      arc_chain: {instances: 0, state: none}
      alignment: {spf: aligned, dkim: not_applicable}
  - file: plain-rfc5321-d3.eml
    provider_label: plain-rfc
    status: verified
    sources:
      - https://www.rfc-editor.org/rfc/rfc5321.txt (Appendix D.3)
    verified_on: '2026-11-07'
    notes: "RFC 5321 D.3 DATA content; host names bar.com/foo.com/xyz.com replaced by example.org/.net/.com equivalents."
    facts:
      hop_count: 1
      auth_methods: []
      arc_chain: {instances: 0, state: none}
      alignment: {spf: not_applicable, dkim: not_applicable}
  - file: arc-rfc8617-appendix-b.eml
    provider_label: arc-rfc8617
    status: verified
    sources:
      - https://www.rfc-editor.org/rfc/rfc8617.txt (Appendix B)
    verified_on: '2026-11-07'
    notes: "RFC 8617 B example; .example hosts mapped to example.com/.net/.org and public IPs to 198.51.100.157 / 203.0.113.15 / 203.0.113.9. Signature values are the RFC placeholders and are not cryptographically verifiable. Alignment is identifier alignment only (header.i / smtp.from vs From domain), independent of the pass/fail results claimed."
    facts:
      hop_count: 4
      auth_methods: [spf, dkim, dmarc, arc]
      arc_chain: {instances: 3, cv: [none, pass, pass], state: claimed_pass}
      alignment: {spf: aligned, dkim: aligned}
