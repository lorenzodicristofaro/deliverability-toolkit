    notes: "Hand-written. NUL bytes in a header value and in the body (RFC 5322 3.5 text excludes NUL). The source cites the rule being violated, not a provider claim."
    contains_nul: true
    facts:
      must_not_crash: true
      defects: [nul_byte]
