# Failing lookups at the _dmarc name and at the organizational-domain fallback name.
zones:
  default:
    - {name: _dmarc.servfail.example.com, type: TXT, state: servfail, rcode: 2}
    - {name: _dmarc.refused.example.com, type: TXT, state: refused, rcode: 5}
    - {name: _dmarc.timeout.example.com, type: TXT, state: timeout}
    - {name: _dmarc.truncated.example.com, type: TXT, state: truncated}
    - {name: _dmarc.malformed.example.com, type: TXT, state: malformed}
    - {name: _dmarc.down.example.com, type: TXT, state: network_error}
    # Fallback: the subdomain has no record (nxdomain), the organizational domain fails.
    - {name: _dmarc.example.org, type: TXT, state: servfail, rcode: 2}
    - {name: sub.example.org, type: A, ttl: 300, rdata: [192.0.2.40]}
