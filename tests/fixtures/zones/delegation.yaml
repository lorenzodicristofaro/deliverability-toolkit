# Trace chain: root -> com -> example.com. 2001:db8::53 serves example.com; the private referral
# (example.net delegated to 10.0.0.53) is for the SSRF guard test in M2-09.
zones:
  192.0.2.1:  # a root server
    - referral:
        zone: com
        ns:
          - {name: a.gtld.example.net, addr: 192.0.2.2}
  192.0.2.2:  # a com server
    - referral:
        zone: example.com
        ns:
          - {name: ns1.example.net, addr: 192.0.2.3}
    - referral:
        zone: example.net
        ns:
          - {name: ns.private.example.net, addr: 10.0.0.53}
  192.0.2.3:  # authoritative for example.com
    - {name: example.com, type: A, ttl: 300, rdata: [192.0.2.10]}
    - {name: example.com, type: NS, ttl: 86400, rdata: [ns1.example.net]}
