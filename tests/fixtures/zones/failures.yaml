# Failure modes. Names absent from every list resolve to nxdomain; names with other types to nodata.
zones:
  default:
    - {name: nodata.example.com, type: A, ttl: 300, rdata: [192.0.2.30]}
    - {name: servfail.example.com, type: A, state: servfail, rcode: 2}
    - {name: refused.example.com, type: A, state: refused, rcode: 5}
    - {name: timeout.example.com, type: A, state: timeout}
    - {name: truncated.example.com, type: TXT, state: truncated}
    - {name: malformed.example.com, type: A, state: malformed}
    - {name: down.example.com, type: A, state: network_error}
    - {name: deep.leaf.example.com, type: A, ttl: 60, rdata: [192.0.2.31]}
