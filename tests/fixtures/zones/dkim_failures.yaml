    - {name: sel._domainkey.m-servfail.example.com, type: CNAME, ttl: 300, rdata: ["mid-servfail.dkim.example.net."]}
    - {name: mid-servfail.dkim.example.net, type: TXT, state: servfail}
    - {name: sel._domainkey.n-servfail.example.com, type: CNAME, ttl: 300, rdata: ["mid2-servfail.dkim.example.net."]}
