# Fake ESP profile for loader tests: every host is under example.com / example.net.
id: example-esp
name: Example ESP
homepage: https://esp.example.com
spf:
  includes: ["spf.esp.example.com", "_spf.esp.example.net"]
dkim:
  selectors:
    - { name: s1, type: cname, target_pattern: "s1.dkim.*.esp.example.com" }
    - { name: s2, type: cname, target_pattern: "s2.dkim.*.esp.example.com" }
    - { name: k1, type: txt }
return_path:
  type: cname
  notes_key: esp.example_esp.return_path
tracking_domain: { type: cname, optional: true }
pitfalls:
  - code: ESP_EXAMPLE_ESP_LINK_BRANDING_MISSING
    notes_key: esp.example_esp.link_branding
    severity: low
verified_on: 2026-01-15
sources: ["https://docs.esp.example.com/dns-setup"]
status: verified
